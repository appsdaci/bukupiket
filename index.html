<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Piket Digital — SMAN 2 CIMALAKA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1E3A5F;
  --ink-dark:#132840;
  --paper:#FBFAF5;
  --paper-line:#DDD6C4;
  --card:#FFFFFF;
  --stamp-red:#B23A20;
  --sage:#4C7A6B;
  --sage-light:#E4EEE9;
  --text:#2B2E33;
  --text-mute:#6B6F76;
  --amber:#B8811A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size:100% 32px;
  font-family:'Inter',sans-serif;
  color:var(--text);
}
.app-shell{
  display:flex;
  min-height:100vh;
  align-items:stretch;
}
/* ---- Sidebar ---- */
aside.sidebar{
  width:252px;
  flex:0 0 252px;
  background:linear-gradient(180deg, var(--ink) 0%, var(--ink-dark) 100%);
  color:#fff;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  border-right:4px solid var(--stamp-red);
}
.sidebar .brand{
  padding:20px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  gap:12px;
}
.sidebar .brand-logo{
  width:40px;
  height:auto;
  flex:0 0 auto;
  display:block;
}
.sidebar .brand-text{ min-width:0; }
.sidebar .brand .school{
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#8FA6BC;
  margin-bottom:6px;
  font-family:'IBM Plex Mono',monospace;
}
.sidebar .brand .title{
  font-family:'Zilla Slab',serif;
  font-size:20px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:.2px;
}
.sidebar .brand .sub{
  font-size:11.5px;
  color:#AEBBC8;
  margin-top:6px;
  font-family:'IBM Plex Mono',monospace;
  line-height:1.5;
}
nav.tabs{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:14px 12px;
  overflow-y:auto;
  flex:1;
}
nav.tabs button{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13.5px;
  background:transparent;
  color:#C9D4DE;
  border:none;
  border-left:3px solid transparent;
  padding:11px 12px;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s;
}
nav.tabs button .ico{ font-size:15px; width:18px; text-align:center; flex:0 0 auto; }
nav.tabs button:hover{ color:#fff; background:rgba(255,255,255,.06); }
nav.tabs button.active{
  color:#fff;
  background:rgba(255,255,255,.1);
  border-left:3px solid var(--stamp-red);
}
.sidebar .side-foot{
  padding:16px 20px 20px;
  border-top:1px solid rgba(255,255,255,.12);
}
.sidebar .today{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  background:rgba(255,255,255,.08);
  padding:7px 10px;
  border-radius:5px;
  border:1px solid rgba(255,255,255,.15);
  margin-bottom:8px;
}
.sidebar .tag-shared{ color:#9FD6BC !important; }
/* ---- Main content area ---- */
.app-main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
header.topbar{
  background:var(--card);
  border-bottom:1px solid var(--paper-line);
  padding:16px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
header.topbar .topbar-title{
  font-family:'Zilla Slab',serif;
  font-size:18px;
  font-weight:700;
  color:var(--ink);
}
main{
  max-width:1180px;
  width:100%;
  margin:0 auto;
  padding:26px 30px 60px;
}
/* ---- Hamburger toggle (mobile/tablet) ---- */
.menu-toggle{
  display:none;
  align-items:center;
  justify-content:center;
  width:36px; height:36px;
  border:1px solid var(--paper-line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  font-size:18px;
  cursor:pointer;
  flex:0 0 auto;
}
.menu-toggle:hover{ background:var(--sage-light); }
.sidebar-backdrop{
  display:none;
  position:fixed; inset:0;
  background:rgba(19,40,64,.5);
  z-index:998;
}
.sidebar-backdrop.show{ display:block; }

/* ---- Responsive breakpoints ---- */

/* Tablets & small laptops: narrower sidebar, icon labels stay */
@media (max-width:1024px){
  aside.sidebar{ width:210px; flex:0 0 210px; }
  main{ padding:22px 20px 50px; }
}

/* Tablets in portrait & phones: sidebar becomes an off-canvas drawer */
@media (max-width:860px){
  .menu-toggle{ display:flex; }
  header.topbar{ padding:14px 16px; }
  main{ padding:18px 14px 44px; }

  aside.sidebar{
    position:fixed;
    top:0; left:0;
    height:100vh;
    width:270px;
    flex:0 0 270px;
    z-index:999;
    transform:translateX(-100%);
    transition:transform .25s ease;
    box-shadow:0 0 30px rgba(0,0,0,.3);
  }
  aside.sidebar.open{ transform:translateX(0); }
  nav.tabs{ flex-direction:column; }
}

/* Small phones: tighter spacing & single-column stat cards */
@media (max-width:480px){
  main{ padding:14px 10px 40px; }
  .card{ padding:14px 14px; }
  .stat-grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ padding:12px 12px; gap:10px; }
  .stat .icn{ width:36px; height:36px; font-size:16px; }
  .stat .num{ font-size:20px; }
  h2.panel-title{ font-size:18px; }
  .toolbar{ flex-direction:column; align-items:stretch; }
  .toolbar .field{ min-width:0; width:100%; }
  .form-actions{ flex-wrap:wrap; }
  .pw-modal{ width:100%; }
}
.panel{ display:none; animation:fade .25s ease; }
.panel.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

h2.panel-title{
  font-family:'Zilla Slab',serif;
  font-size:21px;
  color:var(--ink);
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
}
p.panel-desc{
  color:var(--text-mute);
  font-size:13.5px;
  margin:0 0 18px;
}
.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:6px;
  box-shadow:0 1px 2px rgba(30,58,95,.05);
  padding:18px 20px;
  margin-bottom:20px;
}
.card h3{
  font-family:'Zilla Slab',serif;
  font-size:15.5px;
  margin:0 0 14px;
  color:var(--ink);
  border-bottom:1px dashed var(--paper-line);
  padding-bottom:8px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}
label{
  font-size:12px;
  font-weight:600;
  color:var(--text-mute);
  display:block;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.4px;
}
input,select,textarea{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--paper-line);
  border-radius:4px;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  background:#fff;
  color:var(--text);
}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--sage);
  outline-offset:1px;
  border-color:var(--sage);
}
textarea{ resize:vertical; min-height:44px; }
.btn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
  padding:9px 18px;
  border-radius:4px;
  border:none;
  cursor:pointer;
  background:var(--ink);
  color:#fff;
  transition:.15s;
}
.btn:hover{ background:var(--ink-dark); }
.btn.secondary{ background:var(--sage); }
.btn.secondary:hover{ background:#3c6355; }
.btn.danger{ background:transparent; color:var(--stamp-red); padding:4px 8px; font-size:12px; }
.btn.danger:hover{ text-decoration:underline; }
.form-actions{ margin-top:14px; display:flex; gap:10px; align-items:center; }
.hint{ font-size:12px; color:var(--text-mute); }

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.table-scroll table{ min-width:560px; }
thead th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--text-mute);
  padding:8px 10px;
  border-bottom:2px solid var(--ink);
}
tbody td{
  padding:9px 10px;
  border-bottom:1px solid var(--paper-line);
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  vertical-align:top;
}
tbody tr:hover{ background:var(--sage-light); }
.empty-row td{
  text-align:center;
  color:var(--text-mute);
  font-family:'Inter',sans-serif;
  padding:22px;
}
.badge{
  display:inline-block;
  padding:2px 8px;
  border-radius:99px;
  font-size:11px;
  font-weight:600;
  font-family:'Inter',sans-serif;
}
.badge.low{ background:#E4EEE9; color:var(--sage); }
.badge.mid{ background:#FCEFD9; color:var(--amber); }
.badge.high{ background:#FBE3DD; color:var(--stamp-red); }
.panggil-cell{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.btn-sm{ padding:5px 10px; font-size:11.5px; }
.stamp{
  display:inline-block;
  border:2px solid var(--stamp-red);
  color:var(--stamp-red);
  font-family:'Zilla Slab',serif;
  font-weight:700;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:3px;
  transform:rotate(-3deg);
  background:rgba(178,58,32,.05);
}
/* ================= MODAL KATA SANDI ================= */
.pw-overlay{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(19,40,64,.6);
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  opacity:0; visibility:hidden;
  transition:opacity .22s ease;
  padding:20px;
}
.pw-overlay.show{ opacity:1; visibility:visible; }
.pw-modal{
  width:360px; max-width:100%;
  background:var(--paper);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(19,40,64,.45), 0 0 0 1px rgba(255,255,255,.06);
  transform:translateY(18px) scale(.95);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);
}
.pw-overlay.show .pw-modal{ transform:translateY(0) scale(1); }
.pw-modal.shake{ animation:pwShake .42s; }
@keyframes pwShake{
  10%,90%{ transform:translateX(-1px); }
  20%,80%{ transform:translateX(3px); }
  30%,50%,70%{ transform:translateX(-7px); }
  40%,60%{ transform:translateX(7px); }
}
.pw-modal-head{
  position:relative;
  background:linear-gradient(135deg, var(--ink) 0%, var(--ink-dark) 100%);
  padding:30px 26px 22px;
  text-align:center;
  color:#fff;
  border-bottom:5px solid var(--stamp-red);
  overflow:hidden;
}
.pw-modal-head::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0, transparent 45%),
                   radial-gradient(circle at 85% 75%, rgba(178,58,32,.18) 0, transparent 50%);
}
.pw-lock-badge{
  position:relative;
  width:56px; height:56px; margin:0 auto 14px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center;
  font-size:24px;
  box-shadow:0 0 0 6px rgba(255,255,255,.05);
  animation:pwPulse 2.4s ease-in-out infinite;
}
@keyframes pwPulse{
  0%,100%{ box-shadow:0 0 0 6px rgba(255,255,255,.05); }
  50%{ box-shadow:0 0 0 10px rgba(255,255,255,.09); }
}
.pw-modal-head h3{
  position:relative;
  font-family:'Zilla Slab',serif;
  font-size:19px; font-weight:700;
  margin:0 0 4px;
  letter-spacing:.2px;
}
.pw-modal-head p{
  position:relative;
  margin:0;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:#C9D4DE;
  letter-spacing:.3px;
}
.pw-modal-body{ padding:24px 26px 26px; }
.pw-field-label{
  font-size:11px; font-weight:600; color:var(--text-mute);
  text-transform:uppercase; letter-spacing:.5px;
  display:block; margin-bottom:6px;
}
.pw-input-wrap{ position:relative; }
.pw-input-wrap input{
  width:100%;
  padding:11px 42px 11px 14px;
  border:1.5px solid var(--paper-line);
  border-radius:7px;
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;
  letter-spacing:2px;
  background:#fff;
  color:var(--text);
  transition:.15s;
}
.pw-input-wrap input:focus{
  outline:none;
  border-color:var(--sage);
  box-shadow:0 0 0 3px var(--sage-light);
}
.pw-input-wrap.err input{
  border-color:var(--stamp-red);
  box-shadow:0 0 0 3px #FBE3DD;
}
.pw-eye{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:32px; height:32px;
  border:none; background:transparent; cursor:pointer;
  color:var(--text-mute); font-size:16px;
  display:flex; align-items:center; justify-content:center;
  border-radius:6px;
  transition:.15s;
}
.pw-eye:hover{ background:var(--sage-light); color:var(--sage); }
.pw-error-msg{
  display:none;
  align-items:center; gap:6px;
  margin-top:9px;
  font-size:12px; font-weight:600;
  color:var(--stamp-red);
  font-family:'Inter',sans-serif;
}
.pw-error-msg.show{ display:flex; }
.pw-modal-actions{
  display:flex; gap:10px;
  margin-top:20px;
}
.pw-btn{
  flex:1;
  font-family:'Inter',sans-serif;
  font-weight:600; font-size:13.5px;
  padding:11px 14px;
  border-radius:7px;
  border:none; cursor:pointer;
  transition:.15s;
}
.pw-btn-cancel{
  background:transparent;
  color:var(--text-mute);
  border:1.5px solid var(--paper-line);
}
.pw-btn-cancel:hover{ background:var(--sage-light); border-color:var(--sage); color:var(--sage); }
.pw-btn-submit{
  background:var(--ink);
  color:#fff;
  box-shadow:0 4px 12px rgba(30,58,95,.25);
}
.pw-btn-submit:hover{ background:var(--ink-dark); }
.pw-modal-foot{
  text-align:center;
  margin-top:16px;
  font-size:11px;
  color:var(--text-mute);
  font-family:'IBM Plex Mono',monospace;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-bottom:20px;
}
.stat{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:8px;
  padding:16px 18px;
  box-shadow:0 1px 3px rgba(30,58,95,.06);
  display:flex;
  align-items:center;
  gap:14px;
  transition:.15s;
}
.stat:hover{ box-shadow:0 4px 14px rgba(30,58,95,.1); transform:translateY(-1px); }
.stat .icn{
  flex:0 0 auto;
  width:44px; height:44px;
  border-radius:9px;
  background:var(--sage-light);
  color:var(--sage);
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.stat.alert .icn{ background:#FBE3DD; color:var(--stamp-red); }
.stat .num{
  font-family:'Zilla Slab',serif;
  font-size:26px;
  font-weight:700;
  color:var(--ink);
  line-height:1.1;
}
.stat .lbl{
  font-size:11.5px;
  color:var(--text-mute);
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-top:2px;
}
.alert-list{ display:flex; flex-direction:column; gap:8px; }
.alert-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px 14px;
  background:#FBE3DD;
  border:1px solid #f0bdae;
  border-radius:5px;
  padding:9px 12px;
  font-size:13px;
}
.alert-item .who{ font-weight:600; color:var(--ink-dark); }
.alert-item .meta{ font-size:12px; color:var(--text-mute); }
.tag-shared{
  font-size:11px;
  color:var(--text-mute);
  font-family:'IBM Plex Mono',monospace;
  margin-top:2px;
}
.status-radio{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  padding:8px 0 2px;
}
.status-radio label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  text-transform:none;
  font-weight:500;
  color:var(--text);
  cursor:pointer;
}
.status-radio input{ width:auto; }
.loading{ padding:30px; text-align:center; color:var(--text-mute); font-family:'IBM Plex Mono',monospace; font-size:13px; }
.ac-wrap{ position:relative; }
.ac-list{
  display:none;
  position:absolute;
  z-index:40;
  top:calc(100% + 4px);
  left:0;
  right:0;
  max-height:220px;
  overflow-y:auto;
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:6px;
  box-shadow:0 6px 18px rgba(30,58,95,.15);
}
.ac-item{
  padding:9px 12px;
  font-size:13.5px;
  cursor:pointer;
  border-bottom:1px solid var(--paper-line);
}
.ac-item:last-child{ border-bottom:none; }
.ac-item:hover, .ac-item.hi{ background:var(--sage-light); }
.ac-empty{ padding:9px 12px; font-size:12.5px; color:var(--text-mute); font-style:italic; }
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
.toolbar .field{ min-width:150px; }
.report-head{ display:none; }
@media print{
  aside.sidebar, header.topbar, .no-print{ display:none !important; }
  body{ background:#fff; }
  .app-shell{ display:block; }
  .report-head{ display:block; text-align:center; margin-bottom:18px; }
  .report-head img{ width:52px; height:auto; margin:0 auto 6px; display:block; }
  .report-head h1{ font-family:'Zilla Slab',serif; font-size:20px; margin:0; color:#000; }
  .report-head .sub{ font-size:12px; color:#333; margin-top:2px; }
  .card{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
  main{ max-width:100%; padding:0; }
}
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" id="brandLogo" alt="Logo SMAN 2 Cimalaka">
      <div class="brand-text">
        <div class="school">SMAN 2 Cimalaka</div>
        <div class="title">📋 Buku Piket Digital</div>
        <div class="sub">Rekap piket harian, kesiangan, kehadiran &amp; ketidakhadiran guru</div>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button data-tab="dashboard"><span class="ico">📊</span><span>Dasbor</span></button>
      <button data-tab="kesiangan"><span class="ico">⏰</span><span>Kesiangan Siswa</span></button>
      <button data-tab="kehadiran" class="active"><span class="ico">✅</span><span>Kehadiran Siswa</span></button>
      <button data-tab="guru-absen"><span class="ico">🧑‍🏫</span><span>Ketidakhadiran Guru</span></button>
      <button data-tab="laporan"><span class="ico">📈</span><span>Laporan Bulanan</span></button>
      <button data-tab="data-siswa"><span class="ico">🎓</span><span>Data Siswa</span></button>
      <button data-tab="data-guru"><span class="ico">🧑‍💼</span><span>Data Guru</span></button>
    </nav>

    <div class="side-foot">
      <div class="today" id="todayBox"></div>
      <div class="tag-shared" id="connBox"></div>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Buka menu">☰</button>
      <div class="topbar-title">Sistem Buku Piket Digital</div>
    </header>
    <main id="main">
      <div class="loading" id="globalLoading">Memuat buku piket…</div>
    </main>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="pw-overlay" id="pwOverlay">
  <div class="pw-modal" id="pwModalBox">
    <div class="pw-modal-head">
      <div class="pw-lock-badge">🔒</div>
      <h3>Akses Guru / Admin</h3>
      <p>MENU INI DILINDUNGI KATA SANDI</p>
    </div>
    <div class="pw-modal-body">
      <label class="pw-field-label" for="pwInput">Kata Sandi</label>

/* ================= PROTEKSI KATA SANDI (khusus guru/admin) ================= */
// Kata sandi kini disimpan di dalam Spreadsheet Anda sendiri, di sheet bernama "Pengaturan"
// (kolom "Key" berisi kata "password", kolom "Value" berisi kata sandinya).
// Nilai di bawah ini HANYA dipakai sebagai cadangan, jika sheet "Pengaturan" belum
// dibuat atau baris "password" belum diisi.
const ADMIN_PASSWORD_FALLBACK = "piket2026";
// Menu di daftar ini akan meminta kata sandi. Menu di luar daftar ini (Kehadiran Siswa
// & Ketidakhadiran Guru) tetap bisa diakses bebas oleh siswa tanpa kata sandi.
const PROTECTED_TABS = ['dashboard', 'kesiangan', 'laporan', 'data-siswa', 'data-guru'];

// Catatan: ini proteksi sederhana di sisi tampilan (cocok untuk mencegah siswa iseng
// membuka menu guru sehari-hari). Karena file HTML ini bisa dibuka & dibaca siapa saja
// di komputernya sendiri, ini BUKAN pengaman tingkat tinggi untuk data sensitif.

// Cari nilai di sheet "Pengaturan" berdasarkan nama kunci (Key), tidak peduli huruf besar/kecil
// pada nama kolom maupun nilai kunci, supaya toleran terhadap variasi penulisan header.
function ambilPengaturan(namaKey){
  for(const row of (DB.pengaturan||[])){
    let k, v;
    for(const prop in row){
      const pl = String(prop).toLowerCase();
      if(pl === 'key') k = row[prop];
      if(pl === 'value') v = row[prop];
    }
    if(String(k||'').trim().toLowerCase() === namaKey.toLowerCase()) return v;
  }
  return undefined;
}
function getAdminPassword(){
  const dariSheet = ambilPengaturan('password');
  return (dariSheet !== undefined && dariSheet !== null && String(dariSheet).trim() !== '')
    ? String(dariSheet)
    : ADMIN_PASSWORD_FALLBACK;
}

function isUnlocked(){ return sessionStorage.getItem('piketUnlocked') === '1'; }

/* Modal kata sandi bergaya (menggantikan prompt() bawaan browser) */
function mintaPasswordAkses(){
  return new Promise(resolve=>{
    const overlay = document.getElementById('pwOverlay');
    const box = document.getElementById('pwModalBox');
    const wrap = document.getElementById('pwInputWrap');
    const input = document.getElementById('pwInput');
    const eye = document.getElementById('pwEye');
    const errMsg = document.getElementById('pwErrorMsg');
    const btnCancel = document.getElementById('pwCancelBtn');
    const btnSubmit = document.getElementById('pwSubmitBtn');

    function cleanup(){
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKeydown);
      btnCancel.removeEventListener('click', onCancel);
      btnSubmit.removeEventListener('click', onSubmit);
      eye.removeEventListener('click', onEye);
      input.type = 'password';
      eye.textContent = '👁';
      input.value = '';
      wrap.classList.remove('err');
      errMsg.classList.remove('show');
    }
    function onCancel(){ cleanup(); resolve(false); }
    function onSubmit(){
      const pw = input.value;
      if(pw === getAdminPassword()){
        sessionStorage.setItem('piketUnlocked', '1');
        cleanup();
        resolve(true);
      }else{
        wrap.classList.add('err');
        errMsg.classList.add('show');
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        input.value = '';
        input.focus();
      }
    }
    function onEye(){
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      eye.textContent = showing ? '👁' : '🙈';
    }
    function onKeydown(e){
      if(e.key === 'Enter') onSubmit();
      if(e.key === 'Escape') onCancel();
    }

    btnCancel.addEventListener('click', onCancel);
    btnSubmit.addEventListener('click', onSubmit);
    eye.addEventListener('click', onEye);
    document.addEventListener('keydown', onKeydown);

    overlay.classList.add('show');
    setTimeout(()=>input.focus(), 150);
  });
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmtDate(d){
  try{ return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return d; }
}

function isConnected(){ return !!SHEET_API_URL; }

// Bandingkan teks dengan aman walau datanya kosong/undefined (mis. sisa dari upload yang gagal).
function cmpText(a,b){ return String(a||'').localeCompare(String(b||'')); }

async function apiRead(){
  const res = await fetch(`${SHEET_API_URL}?action=read`);
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;

async function runSaving(triggerEl, fn){
  const original = triggerEl.tagName === 'FORM'
    ? triggerEl.querySelector('button[type=submit]')
    : triggerEl;
  const label = original ? original.textContent : '';
  if(original){ original.disabled = true; original.textContent = 'Menyimpan…'; }
  try{
    await fn();
  }catch(err){
    alert('Gagal menyimpan ke Spreadsheet:\n' + err.message + '\n\nPeriksa koneksi internet dan URL Web App di SHEET_API_URL.');
  }finally{
    if(original){ original.disabled = false; original.textContent = label; }
  }
}

function parseBulkLines(text){
  return text.split(/\r?\n/)
    .map(l=>l.trim())
    .filter(l=>l.length)
    .map(l=> l.split(/\t|,/).map(c=>c.trim().replace(/^"|"$/g,'')));
}
function isHeaderRow(cols){
  const first = (cols[0]||'').toLowerCase();
  return first === 'nama' || first === 'nama siswa' || first === 'nama guru';
}

function monthKey(dateStr){ return dateStr ? String(dateStr).slice(0,7) : ''; }
function monthLabel(ym){
  if(!ym) return '-';
  const [y,m] = ym.split('-');
  const names = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${names[parseInt(m,10)-1]} ${y}`;
}
function downloadCSV(filename, headers, rows){
  const csv = [headers.join(',')].concat(
    rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(','))
  ).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= RATING LOGIC ================= */
function kesianganRating(count){
  if(count >= 5) return {level:'high', label:'Rating 3 — Pemanggilan Ortu', cls:'high'};
  if(count >= 3) return {level:'mid', label:'Rating 2 — Peringatan Tertulis', cls:'mid'};
  return {level:'low', label:'Rating 1 — Peringatan Lisan', cls:'low'};
}
function kesianganRecap(){
  const map = {};
  DB.kesiangan.forEach(r=>{
    const k = r.namaSiswa+'|'+r.kelas;
    map[k] = map[k] || {namaSiswa:r.namaSiswa, kelas:r.kelas, count:0};
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count);
}
function kehadiranRecap(){
  const map = {};
  DB.kehadiran.forEach(r=>{
    const k = r.namaSiswa+'|'+r.kelas;
    map[k] = map[k] || {namaSiswa:r.namaSiswa, kelas:r.kelas, Ijin:0, Sakit:0, Alfa:0, Hadir:0};
    map[k][r.status] = (map[k][r.status]||0)+1;
  });
  return Object.values(map).map(v=>({...v, totalAbsen:v.Ijin+v.Sakit+v.Alfa}))
    .sort((a,b)=>b.totalAbsen-a.totalAbsen);
}
function guruAbsenRecap(){ return rekapGuruAbsenDari(DB.guruAbsen); }
function guruTidakHadir(status){ return status === 'Tidak Hadir' || status === 'Tidak Hadir (Memberi Tugas)'; }
function guruStatusInfo(status){
  if(status === 'Tidak Hadir') return {cls:'high', label:'Tidak Hadir'};
  if(status === 'Tidak Hadir (Memberi Tugas)') return {cls:'mid', label:'Tidak Hadir (Memberi Tugas)'};
  return {cls:'low', label:'Hadir'};
}
function rekapGuruAbsenDari(rows){
  const map = {};
  rows.forEach(r=>{
    if(!guruTidakHadir(r.kehadiran)) return;
    map[r.namaGuru] = map[r.namaGuru] || {namaGuru:r.namaGuru, mapel:r.mapel, totalJam:0, kejadian:0, jamKosong:0, kejadianKosong:0, jamTugas:0, kejadianTugas:0};
    const jam = Number(r.jumlahJam)||0;
    map[r.namaGuru].totalJam += jam;
    map[r.namaGuru].kejadian += 1;
    if(r.kehadiran === 'Tidak Hadir (Memberi Tugas)'){
      map[r.namaGuru].jamTugas += jam;
      map[r.namaGuru].kejadianTugas += 1;
    }else{
      map[r.namaGuru].jamKosong += jam;
      map[r.namaGuru].kejadianKosong += 1;
    }
  });
  return Object.values(map).sort((a,b)=>b.totalJam-a.totalJam);
}

/* ================= PENCARIAN (AUTOCOMPLETE) ================= */
// Menggantikan <datalist>/<select> bawaan browser, yang seringkali TIDAK berfungsi
// dengan baik (tidak muncul saran / tidak bisa difilter) di banyak browser mobile & WebView Android.
// input: elemen <input type="text">
// listEl: elemen <div> kosong tempat menampilkan saran
// getItems: fungsi -> array of {label, ...dataLain}
// onPick: opsional, dipanggil dengan item yang dipilih user
function setupAutocomplete(input, listEl, getItems, onPick){
  function renderList(query){
    const q = (query||'').trim().toLowerCase();
    const items = getItems().filter(it=> it.label && (!q || it.label.toLowerCase().includes(q)));
    if(!items.length){
      listEl.innerHTML = `<div class="ac-empty">Tidak ada data yang cocok.</div>`;
      listEl.style.display = 'block';
      listEl._items = [];
      return;
    }
    listEl.innerHTML = items.slice(0,50).map((it,i)=>`<div class="ac-item" data-idx="${i}">${esc(it.label)}</div>`).join('');
    listEl._items = items;
    listEl.style.display = 'block';
  }
  input.addEventListener('input', ()=> renderList(input.value));
  input.addEventListener('focus', ()=> renderList(input.value));
  input.addEventListener('blur', ()=> setTimeout(()=>{ listEl.style.display = 'none'; }, 150));
  listEl.addEventListener('mousedown', e=>{
    const row = e.target.closest('.ac-item');
    if(!row) return;
    e.preventDefault();
    const item = listEl._items[Number(row.dataset.idx)];
    if(!item) return;
    input.value = item.label;
    listEl.style.display = 'none';
    if(onPick) onPick(item);
  });
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let laporanBulan = todayStr().slice(0,7);

function renderLaporan(){
  const bulan = laporanBulan;

  const kesFiltered = DB.kesiangan.filter(r=>monthKey(r.tanggal)===bulan);
  const kehFiltered = DB.kehadiran.filter(r=>monthKey(r.tanggal)===bulan);
  const guruRows = rekapGuruAbsenDari(DB.guruAbsen.filter(r=>monthKey(r.tanggal)===bulan));

  const kesMap = {};
  kesFiltered.forEach(r=>{
    const k = r.namaSiswa+'|'+r.kelas;
    kesMap[k] = kesMap[k] || {namaSiswa:r.namaSiswa, kelas:r.kelas, count:0};
    kesMap[k].count++;
  });
  const kesRows = Object.values(kesMap).sort((a,b)=>b.count-a.count);

  const kehMap = {};
  kehFiltered.forEach(r=>{

  const kehRows = Object.values(kehMap).map(v=>({...v, totalAbsen:v.Ijin+v.Sakit+v.Alfa}))

  const fileInputGuru = main.querySelector('#bulkGuruFile');
  const textGuru = main.querySelector('#bulkGuruText');
  fileInputGuru.addEventListener('change', ()=>{
    const f = fileInputGuru.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ textGuru.value = reader.result; };
    reader.readAsText(f);
  });
  main.querySelector('#btnBulkGuru').addEventListener('click', async ()=>{
    const btn = main.querySelector('#btnBulkGuru');
    const info = main.querySelector('#bulkGuruInfo');
    const lines = parseBulkLines(textGuru.value);
    const dataRows = lines.filter(c=>c.length>=2 && !isHeaderRow(c))
      .map(c=>({ nama:c[0], mapel:c[1] }))
      .filter(d=>d.nama && d.mapel);
    if(!dataRows.length){ info.textContent = 'Tidak ada data valid ditemukan.'; return; }
    await runSaving(btn, async ()=>{
      await tambahDataBulk('guru', dataRows);
      renderDataGuru();
      alert(`Berhasil mengunggah ${dataRows.length} data guru.`);
    });
  });
}

(async function init(){

  document.getElementById('brandLogo').src = LOGO_SEKOLAH;
  if(!isConnected()){
    renderSetupScreen();
    return;
  }
  document.getElementById('connBox').textContent = '● Terhubung ke Google Spreadsheet';
  try{
    await loadAll();
    render();
  }catch(err){
    document.getElementById('connBox').textContent = '● Gagal terhubung';
    main.innerHTML = `<div class="card"><h3>Gagal memuat data</h3><p class="hint">${esc(err.message)}. Periksa apakah URL Web App benar dan deployment sudah diatur "Anyone" dapat mengakses.</p></div>`;
  }
})();
</script>
